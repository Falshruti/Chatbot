<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-sidebar: #0f172a;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-glow: rgba(37, 99, 235, 0.15);
      --card-bg: rgba(30, 41, 59, 0.4);
      --bot-msg-bg: rgba(30, 41, 59, 0.5);
      --user-msg-bg: rgba(37, 99, 235, 0.15);
      --user-border: rgba(37, 99, 235, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Left Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 16px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 12px;
      background-color: transparent;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .new-chat-btn:hover {
      background-color: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      justify-content: justify;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      transition: background-color 0.2s;
      group: hover;
    }

    .chat-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .chat-item.active {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .chat-item-link {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      overflow: hidden;
    }

    .chat-item-title {
      font-size: 0.875rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .chat-item-delete {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      transition: opacity 0.2s, color 0.2s;
    }

    .chat-item:hover .chat-item-delete {
      opacity: 1;
    }

    .chat-item-delete:hover {
      color: #ef4444;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      margin-bottom: 4px;
    }

    .user-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .user-details {
      flex: 1;
      overflow: hidden;
    }

    .user-name {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-email {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer-btn {
      width: 100%;
      padding: 10px;
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.8125rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: color 0.2s, background-color 0.2s;
    }

    .footer-btn:hover {
      color: var(--text-main);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .logout-btn:hover {
      color: #f87171;
      background-color: rgba(239, 68, 68, 0.05);
    }

    /* Main Chat Panel */
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      background: radial-gradient(circle at top, #141b2e 0%, var(--bg-main) 60%);
    }

    /* Header */
    .header {
      height: 64px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background-color: rgba(11, 15, 25, 0.8);
      backdrop-filter: blur(12px);
      z-index: 5;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      font-size: 1.25rem;
    }

    .model-selector {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      padding: 8px 16px;
      font-size: 0.875rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .model-selector:hover {
      background-color: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .config-toggle-btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .config-toggle-btn:hover {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.15);
      background-color: rgba(255, 255, 255, 0.03);
    }

    .config-toggle-btn.active {
      color: var(--accent-color);
      border-color: var(--accent-color);
      background-color: rgba(37, 99, 235, 0.08);
    }

    /* Configuration Panel Drawer */
    .config-panel {
      position: absolute;
      top: 64px;
      right: 24px;
      width: 320px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 100;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .config-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .config-field {
      margin-bottom: 16px;
    }

    .config-label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .config-textarea {
      width: 100%;
      height: 100px;
      background-color: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 8px 12px;
      font-size: 0.8125rem;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    .config-textarea:focus {
      border-color: var(--accent-color);
    }

    /* Messages Container */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      display: flex;
      flex-direction: column;
    }

    .messages-inner {
      max-width: 768px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message-row {
      display: flex;
      gap: 16px;
      width: 100%;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .avatar-user {
      background-color: rgba(37, 99, 235, 0.2);
      color: var(--accent-color);
      border: 1px solid var(--user-border);
    }

    .avatar-bot {
      background-color: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .message-content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message-sender {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .message-bubble {
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.9375rem;
      line-height: 1.6;
      word-break: break-word;
      animation: messageSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes messageSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bubble-user {
      background-color: var(--user-msg-bg);
      border: 1px solid var(--user-border);
      color: #eff6ff;
    }

    .bubble-bot {
      background-color: var(--bot-msg-bg);
      border: 1px solid var(--border-color);
      color: #f3f4f6;
    }

    /* Welcome Dashboard */
    .dashboard {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .dashboard-title {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .dashboard-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 40px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }

    .suggestion-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      background-color: rgba(255, 255, 255, 0.03);
      transform: translateY(-2px);
    }

    .suggestion-title {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .suggestion-text {
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    /* Input Area */
    .input-wrapper {
      padding: 24px;
      background: linear-gradient(to top, var(--bg-main) 70%, transparent);
    }

    .input-container-inner {
      max-width: 768px;
      margin: 0 auto;
      position: relative;
    }

    .input-box {
      width: 100%;
      background-color: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 56px 14px 50px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      line-height: 1.5;
      outline: none;
      resize: none;
      height: 52px;
      max-height: 200px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-box:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Attach button */
    .attach-btn {
      position: absolute;
      left: 12px;
      bottom: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background-color 0.2s;
      z-index: 2;
    }

    .attach-btn:hover {
      color: var(--accent-color);
      background-color: rgba(37, 99, 235, 0.1);
    }

    /* File preview chip above input */
    .file-preview-wrap {
      display: none;
      margin-bottom: 10px;
    }

    .file-preview-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 8px;
      padding: 7px 12px;
      max-width: 100%;
      animation: messageSlideIn 0.2s ease-out;
    }

    .file-chip-icon {
      font-size: 1rem;
      flex-shrink: 0;
    }

    .file-chip-name {
      font-size: 0.8125rem;
      font-weight: 500;
      color: #93c5fd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .file-chip-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0;
      margin-left: 4px;
      transition: color 0.2s;
    }

    .file-chip-remove:hover { color: #f87171; }

    /* File message bubble */
    .file-attachment-bubble {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(37, 99, 235, 0.1);
      border: 1px solid rgba(37, 99, 235, 0.2);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 0.8125rem;
    }

    .processing-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px 8px;
      margin-bottom: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .send-btn {
      position: absolute;
      right: 12px;
      bottom: 10px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s;
    }

    .send-btn:hover {
      background-color: var(--accent-hover);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .disclaimer {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    /* Loading dots */
    .loading-bubble {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 8px 16px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: dotBounce 1.2s infinite ease-in-out alternate;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBounce {
      from { opacity: 0.3; transform: translateY(0); }
      to { opacity: 1; transform: translateY(-4px); }
    }

    /* Markdown Formatting inside chats */
    .bubble-bot p {
      margin-bottom: 8px;
    }
    .bubble-bot p:last-child {
      margin-bottom: 0;
    }
    .bubble-bot ul, .bubble-bot ol {
      margin-left: 20px;
      margin-bottom: 8px;
    }
    .bubble-bot li {
      margin-bottom: 4px;
    }
    .bubble-bot code {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      color: #f43f5e;
    }
    .bubble-bot pre {
      background-color: #05070c;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 12px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.825em;
    }
    .bubble-bot pre code {
      background-color: transparent;
      padding: 0;
      color: #e2e8f0;
      font-size: inherit;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-toggle {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="createNewChat()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        New Chat
      </button>
    </div>
    
    <div class="chat-list" id="chat-list">
      <!-- Generated Dynamically -->
    </div>

    <div class="sidebar-footer">
      <!-- User info -->
      <div class="user-info" id="user-info">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-details">
          <div class="user-name" id="user-name">Loading...</div>
          <div class="user-email" id="user-email"></div>
        </div>
      </div>
      <button class="footer-btn" onclick="clearAllChats()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Clear conversations
      </button>
      <button class="footer-btn logout-btn" onclick="logout()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Sign Out
      </button>
    </div>
  </div>

  <!-- Main Panel -->
  <div class="main-panel">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" onclick="toggleSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <select class="model-selector" id="model-selector" onchange="handleModelChange(this.value)">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash (Default)</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
        </select>
      </div>

      <div class="header-right">
        <button class="config-toggle-btn" id="config-toggle" onclick="toggleConfigPanel()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.5 1z"></path></svg>
        </button>
      </div>

      <!-- Config panel drawer -->
      <div class="config-panel" id="config-panel">
        <h4 class="config-title">System Configuration</h4>
        <div class="config-field">
          <label class="config-label">SYSTEM PROMPT / INSTRUCTIONS</label>
          <textarea class="config-textarea" id="system-prompt" oninput="handleSystemPromptChange(this.value)" placeholder="Enter system instructions (e.g. 'You are a poetic assistant...')"></textarea>
        </div>
      </div>
    </header>

    <!-- Chat Space -->
    <div class="chat-messages" id="messages-container">
      <div class="messages-inner" id="messages-inner">
        <!-- Rendered dynamically (Dashboard or messages list) -->
      </div>
    </div>

    <!-- Input Box Area -->
    <div class="input-wrapper">
      <div class="input-container-inner">
        <!-- Hidden file input -->
        <input type="file" id="file-input" style="display:none;"
          accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.txt"
          onchange="handleFileSelect(this)">

        <!-- File preview chip (shown when file is selected) -->
        <div class="file-preview-wrap" id="file-preview-wrap">
          <div class="file-preview-chip">
            <span class="file-chip-icon" id="file-chip-icon">📄</span>
            <span class="file-chip-name" id="file-chip-name">filename.pdf</span>
            <button class="file-chip-remove" onclick="removeAttachment()" title="Remove file">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>

        <!-- Attach button -->
        <button class="attach-btn" id="attach-btn" onclick="triggerFileUpload()" title="Attach file (PDF, image, txt)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
        </button>

        <textarea id="user-input" class="input-box" placeholder="Send a message or attach a PDF/image..." rows="1" onkeydown="handleInputKeyDown(event)"></textarea>
        <button id="send-btn" class="send-btn" onclick="sendMessage()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
      <div class="disclaimer">Gemini can make mistakes. Upload resume PDFs to get company suggestions.</div>
    </div>
  </div>

  <script>
    // State management
    let conversations = [];
    let activeConversationId = null;
    let pendingFile = null; // currently attached file

    // Load initial data
    async function init() {
      // Check auth state first
      try {
        const res = await fetch('/auth/me');
        if (!res.ok) {
          window.location.href = '/login';
          return;
        }
        const user = await res.json();
        // Display user info in sidebar
        const initials = user.name ? user.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2) : user.email[0].toUpperCase();
        document.getElementById('user-avatar').textContent = initials;
        document.getElementById('user-name').textContent = user.name || user.email;
        document.getElementById('user-email').textContent = user.email;
      } catch (err) {
        window.location.href = '/login';
        return;
      }

      const storedConversations = localStorage.getItem('chatbot_ui_conversations');
      const storedActiveId = localStorage.getItem('chatbot_ui_active_id');

      if (storedConversations) {
        conversations = JSON.parse(storedConversations);
      }

      if (storedActiveId && conversations.some(c => c.id === storedActiveId)) {
        activeConversationId = storedActiveId;
      } else if (conversations.length > 0) {
        activeConversationId = conversations[0].id;
      } else {
        createNewChat();
        return;
      }

      saveAndRender();
    }

    function createNewChat() {
      const newChat = {
        id: 'chat_' + Date.now(),
        title: 'New Chat',
        model: 'gemini-2.5-flash',
        systemPrompt: 'You are a helpful, friendly, and highly intelligent AI chatbot assistant. Provide clear, accurate, and structured answers. Use markdown formatting when appropriate. You can also generate images when requested.',
        history: []
      };

      conversations.unshift(newChat);
      activeConversationId = newChat.id;
      saveAndRender();
      
      const inputEl = document.getElementById("user-input");
      if (inputEl) {
        inputEl.focus();
      }
    }

    function selectChat(id) {
      activeConversationId = id;
      saveAndRender();
      
      // Auto close sidebar on mobile
      const sidebar = document.getElementById("sidebar");
      if (window.innerWidth <= 768) {
        sidebar.classList.remove("open");
      }
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      
      conversations = conversations.filter(c => c.id !== id);
      
      if (activeConversationId === id) {
        activeConversationId = conversations.length > 0 ? conversations[0].id : null;
      }
      
      if (conversations.length === 0) {
        createNewChat();
      } else {
        saveAndRender();
      }
    }

    function clearAllChats() {
      if (confirm("Are you sure you want to clear all conversations?")) {
        conversations = [];
        activeConversationId = null;
        createNewChat();
      }
    }

    function handleModelChange(model) {
      const activeChat = getActiveChat();
      if (activeChat) {
        activeChat.model = model;
        saveToLocalStorage();
      }
    }

    function handleSystemPromptChange(prompt) {
      const activeChat = getActiveChat();
      if (activeChat) {
        activeChat.systemPrompt = prompt;
        saveToLocalStorage();
      }
    }

    async function logout() {
      try {
        await fetch('/auth/logout', { method: 'POST' });
      } catch (_) {}
      localStorage.removeItem('chatbot_ui_conversations');
      localStorage.removeItem('chatbot_ui_active_id');
      window.location.href = '/login';
    }

    function getActiveChat() {
      return conversations.find(c => c.id === activeConversationId);
    }

    function saveToLocalStorage() {
      localStorage.setItem('chatbot_ui_conversations', JSON.stringify(conversations));
      localStorage.setItem('chatbot_ui_active_id', activeConversationId);
    }

    function saveAndRender() {
      saveToLocalStorage();
      renderSidebar();
      renderChatSpace();
    }

    // Rendering functions
    function renderSidebar() {
      const listEl = document.getElementById("chat-list");
      listEl.innerHTML = "";

      conversations.forEach(chat => {
        const isActive = chat.id === activeConversationId;
        const itemHtml = `
          <div class="chat-item ${isActive ? 'active' : ''}" onclick="selectChat('${chat.id}')">
            <div class="chat-item-link">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; opacity: 0.7;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              <div class="chat-item-title">${escapeHtml(chat.title)}</div>
            </div>
            <button class="chat-item-delete" onclick="deleteChat('${chat.id}', event)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        `;
        listEl.insertAdjacentHTML('beforeend', itemHtml);
      });
    }

    function useSuggestion(text) {
      const inputEl = document.getElementById("user-input");
      inputEl.value = text;
      inputEl.focus();
      adjustInputHeight();
    }

    function renderChatSpace() {
      const activeChat = getActiveChat();
      if (!activeChat) return;

      // Sync selectors
      document.getElementById("model-selector").value = activeChat.model || 'gemini-1.5-flash';
      document.getElementById("system-prompt").value = activeChat.systemPrompt || '';

      const container = document.getElementById("messages-inner");
      container.innerHTML = "";

      if (activeChat.history.length === 0) {
        // Welcome Dashboard
        const dashboardHtml = `
          <div class="dashboard">
            <h1 class="dashboard-title">Chatbot UI</h1>
            <p class="dashboard-subtitle">A universal and custom AI assistant workspace powered by Gemini.</p>
            <div class="dashboard-grid">
              <div class="suggestion-card" onclick="useSuggestion('Explain quantum computing in simple terms')">
                <div class="suggestion-title">Explain Concept</div>
                <div class="suggestion-text">"Explain quantum computing in simple terms for a child"</div>
              </div>
              <div class="suggestion-card" onclick="useSuggestion('Write an clean, robust email template to request feedback on a project')">
                <div class="suggestion-title">Draft Email</div>
                <div class="suggestion-text">"Write a polite email asking for project feedback"</div>
              </div>
              <div class="suggestion-card" onclick="useSuggestion('/image A futuristic glowing city in cyberpunk style, detailed digital art')">
                <div class="suggestion-title">Generate Image</div>
                <div class="suggestion-text">"/image A futuristic glowing city in cyberpunk style"</div>
              </div>
              <div class="suggestion-card" onclick="useSuggestion('Help me debug a Node.js routing error where req.body is undefined')">
                <div class="suggestion-title">Code Debugging</div>
                <div class="suggestion-text">"Fix a Node.js issue where post request body is empty"</div>
              </div>
            </div>
          </div>
        `;
        container.innerHTML = dashboardHtml;
      } else {
        activeChat.history.forEach(msg => {
          const isUser = msg.role === "user";
          const rowHtml = `
            <div class="message-row">
              <div class="message-avatar ${isUser ? 'avatar-user' : 'avatar-bot'}">
                ${isUser ? 'U' : 'AI'}
              </div>
              <div class="message-content-wrapper">
                <div class="message-sender">${isUser ? 'You' : 'Assistant'}</div>
                <div class="message-bubble ${isUser ? 'bubble-user' : 'bubble-bot'}">
                  ${isUser ? escapeHtml(msg.text).replace(/\n/g, '<br>') : parseMarkdown(msg.text)}
                </div>
              </div>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', rowHtml);
        });
      }

      // Scroll to bottom
      const msgScrollContainer = document.getElementById("messages-container");
      msgScrollContainer.scrollTop = msgScrollContainer.scrollHeight;
    }

    // Send logic
    async function sendMessage() {
      const inputEl = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      
      const userText = inputEl.value.trim();

      // Must have either text OR a file attached
      if (!userText && !pendingFile) return;

      const activeChat = getActiveChat();
      if (!activeChat) return;

      // ── File upload path ────────────────────────────────────────────────────
      if (pendingFile) {
        const file = pendingFile;
        const question = userText || null;
        const fileIcon = file.type === 'application/pdf' ? '📄' :
                         file.type === 'text/plain' ? '📝' :
                         file.type.startsWith('image/') ? '🖼️' : '📁';

        // Build user message text
        const userMsgText = question
          ? `${fileIcon} **${file.name}**\n\n${question}`
          : `${fileIcon} **${file.name}**\n\n_(Analyze this file and provide insights or suggestions)_`;

        inputEl.value = "";
        inputEl.disabled = true;
        sendBtn.disabled = true;
        adjustInputHeight();
        removeAttachment();

        // Set chat title
        if (activeChat.history.length === 0) {
          activeChat.title = `📄 ${file.name.length > 20 ? file.name.substring(0, 20) + '...' : file.name}`;
        }

        activeChat.history.push({ role: 'user', text: userMsgText });
        saveAndRender();

        // Show processing loader with special badge
        const container = document.getElementById("messages-inner");
        const loaderId = 'loader-' + Date.now();
        container.insertAdjacentHTML('beforeend', `
          <div class="message-row" id="${loaderId}">
            <div class="message-avatar avatar-bot">AI</div>
            <div class="message-content-wrapper">
              <div class="message-sender">Assistant</div>
              <div class="message-bubble bubble-bot" style="width:fit-content; padding: 10px 14px;">
                <div class="processing-badge">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                  Reading and analyzing ${file.name}...
                </div>
              </div>
            </div>
          </div>
        `);
        document.getElementById("messages-container").scrollTop = 99999;

        try {
          const data = await uploadFile(file, question, activeChat, loaderId);
          const loader = document.getElementById(loaderId);
          if (loader) loader.remove();

          if (data.reply) {
            activeChat.history.push({ role: 'model', text: data.reply });
          } else {
            activeChat.history.push({ role: 'model', text: `⚠️ **Error:** ${data.error || 'Failed to analyze the file.'}` });
          }
        } catch (err) {
          const loader = document.getElementById(loaderId);
          if (loader) loader.remove();
          activeChat.history.push({ role: 'model', text: `⚠️ **Connection Error:** Could not process the file. Make sure the server is running.` });
        } finally {
          saveAndRender();
          inputEl.disabled = false;
          sendBtn.disabled = false;
          inputEl.focus();
          adjustInputHeight();
        }
        return;
      }

      // ── Normal text message path ─────────────────────────────────────────────

      // Intercept direct /image commands
      if (userText.startsWith('/image ')) {
        const promptText = userText.substring(7).trim();
        if (promptText) {
          inputEl.value = "";
          adjustInputHeight();

          // Update Chat Title if it's the first message
          if (activeChat.history.length === 0) {
            activeChat.title = promptText.length > 24 ? promptText.substring(0, 24) + "..." : promptText;
          }

          // Add to state history
          activeChat.history.push({ role: 'user', text: userText });

          // Generate response with image markdown
          const encodedPrompt = encodeURIComponent(promptText);
          const imgUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true`;
          const replyText = `Here is the AI generated image for: **${promptText}**\n\n![${promptText}](${imgUrl})`;

          activeChat.history.push({ role: 'model', text: replyText });
          saveAndRender();

          inputEl.focus();
          return;
        }
      }

      // Disable input controls
      inputEl.value = "";
      inputEl.disabled = true;
      sendBtn.disabled = true;
      adjustInputHeight();

      // Update Chat Title if it's the first message
      if (activeChat.history.length === 0) {
        activeChat.title = userText.length > 24 ? userText.substring(0, 24) + "..." : userText;
      }

      // Add to state history
      activeChat.history.push({ role: 'user', text: userText });
      saveAndRender();

      // Show loading indicator
      const container = document.getElementById("messages-inner");
      const loaderId = 'loader-' + Date.now();
      const loaderHtml = `
        <div class="message-row" id="${loaderId}">
          <div class="message-avatar avatar-bot">AI</div>
          <div class="message-content-wrapper">
            <div class="message-sender">Assistant</div>
            <div class="message-bubble bubble-bot" style="width:fit-content; padding: 4px 8px;">
              <div class="loading-bubble">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
              </div>
            </div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', loaderHtml);
      const msgScrollContainer = document.getElementById("messages-container");
      msgScrollContainer.scrollTop = msgScrollContainer.scrollHeight;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },

          body: JSON.stringify({
            message: userText,
            history: activeChat.history.slice(0, -1), // Send previous messages
            model: activeChat.model,
            systemPrompt: activeChat.systemPrompt
          })
        });

        const data = await response.json();
        
        // Remove loader
        const loader = document.getElementById(loaderId);
        if (loader) loader.remove();

        if (data.reply) {
          activeChat.history.push({ role: 'model', text: data.reply });
        } else if (data.error) {
          activeChat.history.push({ role: 'model', text: `⚠️ **Error:** ${data.error}` });
        } else {
          activeChat.history.push({ role: 'model', text: `⚠️ **Error:** Unknown server error` });
        }
      } catch (err) {
        const loader = document.getElementById(loaderId);
        if (loader) loader.remove();
        activeChat.history.push({ role: 'model', text: `⚠️ **Connection Error:** Ensure that your local chatbot server is running.` });
      } finally {
        saveAndRender();
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
        adjustInputHeight();
      }
    }

    // ─── File Attachment Handlers ───────────────────────────────────────────
    function triggerFileUpload() {
      document.getElementById('file-input').click();
    }

    function handleFileSelect(input) {
      const file = input.files[0];
      if (!file) return;

      pendingFile = file;

      // Determine emoji icon
      const icons = {
        'application/pdf': '📄',
        'text/plain': '📝',
      };
      const icon = file.type.startsWith('image/') ? '🖼️' : (icons[file.type] || '📁');

      document.getElementById('file-chip-icon').textContent = icon;
      document.getElementById('file-chip-name').textContent = file.name;
      document.getElementById('file-preview-wrap').style.display = 'block';

      // Update placeholder
      document.getElementById('user-input').placeholder = 'Ask something about this file (or just press Send)...';
      document.getElementById('user-input').focus();

      // Reset input so same file can be re-selected
      input.value = '';
    }

    function removeAttachment() {
      pendingFile = null;
      document.getElementById('file-preview-wrap').style.display = 'none';
      document.getElementById('file-input').value = '';
      document.getElementById('user-input').placeholder = 'Send a message or attach a PDF/image...';
    }

    // ─── File Upload & AI Analysis ──────────────────────────────────────────
    async function uploadFile(file, userMessage, activeChat, loaderId) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('message', userMessage);
      formData.append('model', activeChat.model || 'gemini-2.5-flash');

      const response = await fetch('/upload', {
        method: 'POST',
        body: formData
      });

      return response.json();
    }

    // ─── Input layout adjustment ─────────────────────────────────────────────
    function adjustInputHeight() {
      const inputEl = document.getElementById("user-input");
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
    }

    function handleInputKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    document.getElementById("user-input").addEventListener("input", adjustInputHeight);

    // Layout toggles
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("open");
    }

    function toggleConfigPanel() {
      const panel = document.getElementById("config-panel");
      const btn = document.getElementById("config-toggle");
      
      if (panel.style.display === "block") {
        panel.style.display = "none";
        btn.classList.remove("active");
      } else {
        panel.style.display = "block";
        btn.classList.add("active");
      }
    }

    // Helper functions
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function scrollToBottom() {
      const msgScrollContainer = document.getElementById("messages-container");
      if (msgScrollContainer) {
        msgScrollContainer.scrollTop = msgScrollContainer.scrollHeight;
      }
    }

    function handleImageError(img, originalUrl) {
      img.onerror = null; // Prevent infinite loop if fallback fails
      const parent = img.parentNode;
      img.style.display = 'none';
      const directUrl = originalUrl || img.src;
      const errorHtml = `
        <div class="image-error-container" style="background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2); padding: 12px; border-radius: 8px; color: #f87171; font-size: 0.8125rem; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; animation: messageSlideIn 0.3s ease-out;">
          <div style="font-weight: 600; display: flex; align-items: center; gap: 6px;">
            ⚠️ Image Generation rate-limited
          </div>
          <div>The free image service (Pollinations AI) is currently busy or rate-limiting requests. Try again in a moment.</div>
          <a href="${directUrl}" target="_blank" style="color: #60a5fa; text-decoration: underline; font-weight: 500; font-size: 0.75rem; width: fit-content;">Open or retry image directly in new tab &rarr;</a>
        </div>
      `;
      parent.insertAdjacentHTML('beforeend', errorHtml);
      scrollToBottom();
    }

    // Simple parser for bolding, listings, and code blocks
    function parseMarkdown(text) {
      // --- Step 1: Extract image markdown BEFORE escaping (so URLs aren't mangled) ---
      const imagePlaceholders = [];
      let processedText = text.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, (match, alt, url) => {
        const placeholder = `__IMG_PLACEHOLDER_${imagePlaceholders.length}__`;
        // Route Pollinations AI images through our local proxy to avoid cloud IP rate limits
        let imgSrc = url;
        if (url.includes('pollinations.ai')) {
          imgSrc = `/image-proxy?url=${encodeURIComponent(url)}`;
        }
        const imgHtml = `<div style="margin: 10px 0;"><img src="${imgSrc}" alt="${alt}" class="chat-generated-image" style="max-width: 100%; max-height: 400px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); display: block;" onerror="handleImageError(this, '${url}')" onload="scrollToBottom()" /><div style="font-size:0.75rem; color: var(--text-muted); margin-top: 4px;">${alt || 'Generated Image'}</div></div>`;
        imagePlaceholders.push(imgHtml);
        return placeholder;
      });

      // --- Step 2: Escape HTML for rest of the content ---
      let html = escapeHtml(processedText);

      // --- Step 3: Restore image placeholders ---
      imagePlaceholders.forEach((imgHtml, i) => {
        html = html.replace(`__IMG_PLACEHOLDER_${i}__`, imgHtml);
      });

      // Code blocks (```lang code ```)
      html = html.replace(/```(?:[a-zA-Z0-9]+)?\n([\s\S]*?)\n```/g, (match, code) => {
        return `<pre><code>${code}</code></pre>`;
      });

      // Inline code (`code`)
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Bold (**text**)
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

      // Italic (*text*)
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

      // Hyperlinks: only plain URLs not already inside HTML attributes
      html = html.replace(/(?<![="'])(https?:\/\/[^\s<"'\)]+)(?![^<]*>)/g, '<a href="$1" target="_blank" style="color: #60a5fa; text-decoration: underline;">$1</a>');

      // Split lines and paragraphs
      return html.split('\n').map(line => {
        // Don't wrap image divs or html block tags in <p>
        if (line.startsWith('<div') || line.startsWith('<img') || line.startsWith('<pre') || line.startsWith('<blockquote')) {
          return line;
        }
        if (line.startsWith('&gt; ')) {
          return `<blockquote style="border-left: 3px solid var(--accent-color); padding-left: 10px; color: var(--text-muted); margin: 6px 0;">${line.substring(5)}</blockquote>`;
        }
        return line ? `<p>${line}</p>` : '<div style="height: 6px;"></div>';
      }).join('');
    }

    // Close panel drawer when clicking outside
    document.addEventListener("click", e => {
      const panel = document.getElementById("config-panel");
      const btn = document.getElementById("config-toggle");
      if (panel.style.display === "block" && !panel.contains(e.target) && !btn.contains(e.target)) {
        panel.style.display = "none";
        btn.classList.remove("active");
      }
    });

    // Start
    init();
  </script>
</body>
</html>
