<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Chatbot UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080c14;
      --card: rgba(15, 23, 42, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.6);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --accent-hover: #4f46e5;
      --error: #f87171;
      --error-bg: rgba(239, 68, 68, 0.08);
      --success: #34d399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background blobs */
    .bg-blobs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      animation: blobFloat 12s ease-in-out infinite;
    }

    .blob-1 {
      width: 500px; height: 500px;
      background: #6366f1;
      top: -150px; left: -100px;
      animation-delay: 0s;
    }
    .blob-2 {
      width: 400px; height: 400px;
      background: #8b5cf6;
      bottom: -100px; right: -100px;
      animation-delay: 4s;
    }
    .blob-3 {
      width: 300px; height: 300px;
      background: #06b6d4;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 8s;
    }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* Card */
    .card-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 16px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                  0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo / Brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      justify-content: center;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.35);
    }

    .brand-name {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(to right, #a5b4fc, #e879f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Title */
    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .auth-subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
    }

    /* Tab switcher */
    .tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .tab-btn.active {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    /* Form fields */
    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 7px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .field-input-wrap {
      position: relative;
    }

    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .field input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.9375rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .field input::placeholder { color: rgba(148, 163, 184, 0.5); }

    /* Name fields row */
    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .name-row .field { margin-bottom: 0; }

    /* Error / Success alerts */
    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.8125rem;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .alert-error {
      background: var(--error-bg);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--error);
    }

    .alert-success {
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.25);
      color: var(--success);
    }

    .alert.show { display: flex; }

    /* Submit button */
    .submit-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      font-family: inherit;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0);
      transition: background 0.2s;
    }

    .submit-btn:hover::before { background: rgba(255, 255, 255, 0.08); }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-loading .spinner { display: block; }
    .btn-loading .btn-text { display: none; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Footer note */
    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 20px;
    }

    .footer-note span {
      color: #a5b4fc;
      cursor: pointer;
      font-weight: 500;
    }

    .footer-note span:hover { text-decoration: underline; }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      .name-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="card-wrapper">
    <div class="card">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <span class="brand-name">Chatbot UI</span>
      </div>

      <!-- Titles -->
      <h1 class="auth-title" id="auth-title">Welcome back</h1>
      <p class="auth-subtitle" id="auth-subtitle">Sign in to your account to continue</p>

      <!-- Tab Switcher -->
      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
      </div>

      <!-- Error / Success -->
      <div class="alert alert-error" id="error-alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-text"></span>
      </div>

      <div class="alert alert-success" id="success-alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="success-text"></span>
      </div>

      <!-- Form -->
      <form id="auth-form" onsubmit="handleSubmit(event)">

        <!-- Name row (signup only) -->
        <div class="name-row" id="name-fields" style="display:none;">
          <div class="field">
            <label>First Name</label>
            <div class="field-input-wrap">
              <span class="field-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input type="text" id="firstname" placeholder="John" autocomplete="given-name">
            </div>
          </div>
          <div class="field">
            <label>Last Name</label>
            <div class="field-input-wrap">
              <span class="field-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input type="text" id="lastname" placeholder="Doe" autocomplete="family-name">
            </div>
          </div>
        </div>

        <!-- Email -->
        <div class="field">
          <label>Email Address</label>
          <div class="field-input-wrap">
            <span class="field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <label>Password</label>
          <div class="field-input-wrap">
            <span class="field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
        </div>

        <!-- Confirm Password (signup only) -->
        <div class="field" id="confirm-field" style="display:none;">
          <label>Confirm Password</label>
          <div class="field-input-wrap">
            <span class="field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="confirm-password" placeholder="••••••••" autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
          <div class="spinner" id="spinner"></div>
          <span class="btn-text" id="btn-text">Sign In</span>
        </button>
      </form>

      <div class="divider">or</div>

      <div class="footer-note" id="footer-note">
        Don't have an account? <span onclick="switchTab('signup')">Create one free</span>
      </div>

    </div>
  </div>

  <script>
    let currentTab = 'login';

    function switchTab(tab) {
      currentTab = tab;
      const isLogin = tab === 'login';

      // Update tabs
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-signup').classList.toggle('active', !isLogin);

      // Toggle fields
      document.getElementById('name-fields').style.display = isLogin ? 'none' : 'grid';
      document.getElementById('confirm-field').style.display = isLogin ? 'none' : '';

      // Update text
      document.getElementById('auth-title').textContent = isLogin ? 'Welcome back' : 'Create your account';
      document.getElementById('auth-subtitle').textContent = isLogin
        ? 'Sign in to your account to continue'
        : 'Start chatting with AI in seconds';
      document.getElementById('btn-text').textContent = isLogin ? 'Sign In' : 'Create Account';
      document.getElementById('footer-note').innerHTML = isLogin
        ? 'Don\'t have an account? <span onclick="switchTab(\'signup\')">Create one free</span>'
        : 'Already have an account? <span onclick="switchTab(\'login\')">Sign in</span>';

      // Set autocomplete
      document.getElementById('password').autocomplete = isLogin ? 'current-password' : 'new-password';

      clearAlerts();
    }

    function clearAlerts() {
      document.getElementById('error-alert').classList.remove('show');
      document.getElementById('success-alert').classList.remove('show');
    }

    function showError(msg) {
      clearAlerts();
      document.getElementById('error-text').textContent = msg;
      document.getElementById('error-alert').classList.add('show');
    }

    function showSuccess(msg) {
      clearAlerts();
      document.getElementById('success-text').textContent = msg;
      document.getElementById('success-alert').classList.add('show');
    }

    function setLoading(loading) {
      const btn = document.getElementById('submit-btn');
      btn.disabled = loading;
      btn.classList.toggle('btn-loading', loading);
    }

    async function handleSubmit(e) {
      e.preventDefault();
      clearAlerts();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Please fill in all required fields.');
        return;
      }

      if (currentTab === 'signup') {
        const confirmPassword = document.getElementById('confirm-password').value;
        const firstname = document.getElementById('firstname').value.trim();
        const lastname = document.getElementById('lastname').value.trim();

        if (password !== confirmPassword) {
          showError('Passwords do not match.');
          return;
        }

        if (password.length < 6) {
          showError('Password must be at least 6 characters.');
          return;
        }

        setLoading(true);
        try {
          const res = await fetch('/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, firstname, lastname })
          });
          const data = await res.json();

          if (res.ok) {
            showSuccess('Account created! Signing you in...');
            setTimeout(() => { window.location.href = '/'; }, 1200);
          } else {
            showError(data.error || 'Sign up failed. Please try again.');
          }
        } catch (err) {
          showError('Connection error. Is the server running?');
        } finally {
          setLoading(false);
        }

      } else {
        setLoading(true);
        try {
          const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();

          if (res.ok) {
            window.location.href = '/';
          } else {
            showError(data.error || 'Invalid email or password.');
          }
        } catch (err) {
          showError('Connection error. Is the server running?');
        } finally {
          setLoading(false);
        }
      }
    }

    // Check if already logged in
    (async () => {
      try {
        const res = await fetch('/auth/me');
        if (res.ok) {
          window.location.href = '/';
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
